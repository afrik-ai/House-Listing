<!doctype html><html><head><meta charset="utf-8"><title>HouseListing — Build Progress</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e0f12;--card:#16181d;--line:#262a33;--fg:#e8e6e1;--mut:#8b90a0;--ok:#4fc38a;--warn:#e9b44c;--bad:#e2574c;--acc:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 Inter,system-ui,Segoe UI,sans-serif}
header{padding:28px 36px 12px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
h1{margin:0;font-size:22px;letter-spacing:.02em}h1 span{color:var(--mut);font-weight:400}
.meta{color:var(--mut);font-size:13px}.headline{padding:14px 36px;font-size:17px;background:#121419;border-bottom:1px solid var(--line)}
main{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;padding:24px 36px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.p b{display:block;font-size:14px}.p .id{color:var(--mut);font-size:12px}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.pending{background:#23262e;color:var(--mut)}.building{background:#2a2f3f;color:var(--acc)}.critic{background:#3a3020;color:var(--warn)}
.won{background:#1d3a2c;color:var(--ok)}.lost{background:#3d2220;color:var(--bad)}.smoothing{background:#2f2a3f;color:#c9b8ff}
.p .gap{font-size:12px;color:var(--mut);margin-top:6px}.p .v{font-size:12px;margin-top:4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:0 0 10px}
.log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;max-height:640px;overflow:auto;font-size:13px}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}.log div:last-child{border:0}.log time{color:var(--mut);margin-right:8px;font-size:12px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.shots figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.shots img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}.shots figcaption{font-size:12px;padding:6px 10px;color:var(--mut)}
.bar{height:6px;background:#23262e;border-radius:3px;overflow:hidden;margin-top:10px;width:100%}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}
a{color:var(--acc)}
</style></head><body>
<header><h1>HouseListing <span>· Villa Nova · build progress</span></h1><div class="meta" id="meta"></div>
<div class="meta">Play: <a href="/house.html?id=villa-nova">/house.html</a> · Catalog: <a href="/">/</a></div></header>
<div class="headline" id="headline"></div>
<main>
<section><h2>Pieces</h2><div class="bar"><i id="bar" style="width:0%"></i></div><div class="grid" id="grid" style="margin-top:12px"></div>
<h2 style="margin-top:22px">Latest screenshots</h2><div class="shots" id="shots"></div></section>
<section><h2>Activity</h2><div class="log" id="log"></div></section>
</main>
<script>
async function tick(){try{const s=await (await fetch('/progress/status.json?'+Date.now())).json();
document.getElementById('meta').textContent='Phase: '+s.phase+' · Wave '+s.wave+' · updated '+new Date(s.updated).toLocaleTimeString();
document.getElementById('headline').textContent=s.headline;
const done=s.pieces.filter(p=>p.status==='won').length;document.getElementById('bar').style.width=(100*done/s.pieces.length)+'%';
document.getElementById('grid').innerHTML=s.pieces.map(p=>`<div class="p"><span class="id">${p.id} · round ${p.round}</span><b>${p.name}</b><span class="st ${p.status}">${p.status}</span>${p.verdict?`<div class="v">${p.verdict}</div>`:''}${p.gap?`<div class="gap">Gap: ${p.gap}</div>`:''}</div>`).join('');
document.getElementById('log').innerHTML=s.log.map(l=>`<div><time>${new Date(l.t).toLocaleTimeString()}</time>${l.m}</div>`).join('');
document.getElementById('shots').innerHTML=s.shots.map(x=>`<figure><a href="${x.src}" target="_blank"><img src="${x.src}?${Date.parse(x.t)}" loading="lazy"></a><figcaption>${x.caption}</figcaption></figure>`).join('');
}catch(e){}}
tick();setInterval(tick,4000);
</script></body></html>
